name: Publish image

# Builds the release image once per commit on main and pushes it to GHCR.
# Jenkins later finds it by tag, resolves the tag to a digest, and deploys that digest.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  # Must match IMAGE_REPO in the Jenkinsfile. GHCR names must be lowercase.
  IMAGE_REPO: ghcr.io/davidlescard/qg-post-merge-staging-jenkins

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Tag = <package.json version>-<short commit>, e.g. 1.0.0-a1b2c3d. Jenkins computes the same value.
      - name: Compute image tag
        id: meta
        run: |
          version=$(jq -r .version package.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "package.json has no version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record the image digest
        run: |
          cat > image.txt <<EOF
          version=${{ steps.meta.outputs.version }}
          tag=${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          digest=${{ steps.build.outputs.digest }}
          ref=${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}
          commit=${{ github.sha }}
          EOF
          cat image.txt
          {
            echo "### Published image"
            echo '```'
            cat image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.txt
          retention-days: 30
