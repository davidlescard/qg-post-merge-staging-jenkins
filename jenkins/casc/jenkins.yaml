jenkins:
  systemMessage: "Quality Gate Lab CI (configured as code)"
  # One executor: the Playwright workers use fixed ports, so builds must not overlap.
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              description: "Read-only GitHub token for branch and pull request discovery"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: "ghcr-token"
              description: "Classic token with write:packages, used to push images to ghcr.io (optional)"
              username: "${GITHUB_USER}"
              password: "${GHCR_TOKEN:-}"

jobs:
  - script: >
      multibranchPipelineJob('qg-post-merge-staging') {
        branchSources {
          github {
            id('qg-post-merge-staging-github')
            scanCredentialsId('github-token')
            repoOwner('davidlescard')
            repository('qg-post-merge-staging-jenkins')
            buildOriginBranch(true)
            buildOriginBranchWithPR(false)
            buildOriginPRMerge(false)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
      }
